    <script>
      // Gracefully ignore Vite dev server WebSocket disconnects as per runtime constraints
      window.addEventListener('unhandledrejection', function(event) {
        var reason = event && event.reason;
        var msg = (reason && (reason.message || String(reason))) || '';
        var stack = (reason && reason.stack) || '';
        if (
          msg.includes('WebSocket') ||
          msg.includes('vite') ||
          stack.includes('@vite/client') ||
          stack.includes('createWebSocketModuleRunnerTransport')
        ) {
          event.preventDefault();
        }
      });
      window.addEventListener('error', function(event) {
        var msg = (event && event.message) || '';
        var filename = (event && event.filename) || '';
        if (msg.includes('WebSocket') || filename.includes('@vite/client')) {
          event.preventDefault();
        }
      });
    </script>
